<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Vehicle Cleaning Report</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
            padding: 24px;
        }

        .container {
            max-width: 1800px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h2 {
            font-size: 24px;
        }

        .header p {
            color: #64748b;
            margin-top: 5px;
            font-size: 13px;
        }

        button {
            border: 0;
            background: #2563eb;
            color: white;
            padding: 10px 18px;
            border-radius: 7px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .summary {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 16px 22px;
            min-width: 190px;
            box-shadow: 0 2px 8px rgba(15,23,42,.05);
        }

        .card.red {
            border-left: 4px solid #dc2626;
        }

        .label {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 5px;
        }

        .value {
            font-size: 25px;
            font-weight: 700;
        }

        .table-wrapper {
            background: white;
            border-radius: 10px;
            overflow: auto;
            border: 1px solid #e2e8f0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 2600px;
        }

        th {
            background: #172033;
            color: white;
            padding: 10px;
            font-size: 11px;
            text-align: left;
            white-space: nowrap;
            position: sticky;
            top: 0;
        }

        td {
            padding: 9px 10px;
            border-bottom: 1px solid #edf0f4;
            font-size: 11px;
            white-space: nowrap;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        .cleaning {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            padding: 4px 8px;
            border-radius: 15px;
            font-weight: 700;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="header">

        <div>

            <h2>
                Vehicle Cleaning Report
            </h2>
<h5 id="current_timestamp" style="color: #ea580c;"></h5>
            <p>
                Vehicles with Cleaning % below 90% · Sorted by Ward
            </p>

        </div>


        <button onclick="exportCleaningCSV()">
            Export CSV
        </button>

    </div>


    <div id="outputdata"></div>


</div>


<script src="fleet-data.js"></script>
<!-- Vehicle Key No -->
 <script src="./vehicle_key_no.js"></script>
<script src="./clean_less_90/filter.js"></script>

<script src="./clean_less_90/display.js"></script>
<script src="./clean_less_90/export.js"></script>


<script>












</script>


</body>

</html>
