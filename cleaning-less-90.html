<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Vehicle Cleaning Report</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
            padding: 24px;
        }

        .container {
            max-width: 1800px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h2 {
            font-size: 24px;
        }

        .header p {
            color: #64748b;
            margin-top: 5px;
            font-size: 13px;
        }

        button {
            border: 0;
            background: #2563eb;
            color: white;
            padding: 10px 18px;
            border-radius: 7px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .summary {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 16px 22px;
            min-width: 190px;
            box-shadow: 0 2px 8px rgba(15,23,42,.05);
        }

        .card.red {
            border-left: 4px solid #dc2626;
        }

        .label {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 5px;
        }

        .value {
            font-size: 25px;
            font-weight: 700;
        }

        .table-wrapper {
            background: white;
            border-radius: 10px;
            overflow: auto;
            border: 1px solid #e2e8f0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 2600px;
        }

        th {
            background: #172033;
            color: white;
            padding: 10px;
            font-size: 11px;
            text-align: left;
            white-space: nowrap;
            position: sticky;
            top: 0;
        }

        td {
            padding: 9px 10px;
            border-bottom: 1px solid #edf0f4;
            font-size: 11px;
            white-space: nowrap;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        .cleaning {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            padding: 4px 8px;
            border-radius: 15px;
            font-weight: 700;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="header">

        <div>

            <h2>
                Vehicle Cleaning Report
            </h2>
<h5 id="current_timestamp" style="color: #ea580c;"></h5>
            <p>
                Vehicles with Cleaning % below 90% · Sorted by Ward
            </p>

        </div>


        <button onclick="exportCleaningCSV()">
            Export CSV
        </button>

    </div>


    <div id="outputdata"></div>


</div>


<script src="fleet-data.js"></script>


<script>


/* =====================================================
   GET VEHICLES WITH CLEANING % BELOW 90
   ===================================================== */

function getLowCleaningVehicles() {

    document.getElementById(
                "current_timestamp"
            ).textContent =`${window.fleetMeta.generatedAt}`;

            
    if (
        typeof fleetData === "undefined" ||
        !Array.isArray(fleetData)
    ) {
        return [];
    }


 const vehicles = fleetData.filter(
    vehicle => {

        const cleaning =
            Number(
                vehicle.routecleaned_p
            );

        const totalPoints =
            Number(
                vehicle.totalpoints
            );

        return (
            !isNaN(cleaning) &&
            cleaning < 90 &&
            !isNaN(totalPoints) &&
            totalPoints > 0
        );

    }
);


    /* SORT BY WARD */

    vehicles.sort(
        (a, b) => {

            const wardA =
                parseInt(
                    String(
                        a.wardname || ""
                    )
                    .match(/\d+/)?.[0]
                    || "999999",
                    10
                );


            const wardB =
                parseInt(
                    String(
                        b.wardname || ""
                    )
                    .match(/\d+/)?.[0]
                    || "999999",
                    10
                );


            if (
                wardA !== wardB
            ) {

                return wardA - wardB;

            }


            return String(
                a.vehicleno || ""
            ).localeCompare(
                String(
                    b.vehicleno || ""
                ),
                undefined,
                {
                    numeric: true,
                    sensitivity: "base"
                }
            );

        }
    );


    return vehicles;

}


/* =====================================================
   DISPLAY
   ===================================================== */

function displayResults() {

    const output =
        document.getElementById(
            "outputdata"
        );


    const vehicles =
        getLowCleaningVehicles();


    const totalVehicles =
        Array.isArray(
            window.fleetData
        )
            ? window.fleetData.length
            : 0;


    let html = `

        <div class="summary">


            <div class="card">

                <div class="label">
                    Total Vehicles
                </div>

                <div class="value">
                    ${totalVehicles}
                </div>

            </div>


            <div class="card red">

                <div class="label">
                    Cleaning Below 90%
                </div>

                <div class="value">
                    ${vehicles.length}
                </div>

            </div>


        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                    
                        <th>Ward Name</th>

                        

                        <th>Vehicle No.</th>
                        <th>Cleaning %</th>
                        <th>Vehicle Type</th>
                        <th>VStatus</th>
                        <th>Driver Name</th>

                        <th>Time Recorded</th>

                       

                        <th>Vehicle Status</th>

                        

                        <th>Speed</th>

                        <th>GSM</th>

                        <th>GPS</th>

                        <th>Vehicle Battery</th>

                        <th>GPS Battery</th>

                        

                        <th>Driver Mobile</th>

                        

                        

                        <th>Ignition</th>

                        <th>Route Name</th>

                        <th>Total Points</th>

                        <th>Total Cleaned Points</th>

                        <th>Total Not Cleaned Points</th>

                        

                        

                    </tr>

                </thead>


                <tbody>

    `;


    if (
        vehicles.length === 0
    ) {

        html += `

            <tr>

                <td
                    colspan="32"
                    class="no-data"
                >

                    No vehicles found
                    with Cleaning % below 90%.

                </td>

            </tr>

        `;

    }
    else {

        vehicles.forEach(
            (vehicle, index) => {

                html += `

                    <tr>

                    
                        <td>
                            ${safe(
                                vehicle.wardname
                            )}
                        </td>

                        

                        <td>
                            <strong>
                                ${safe(
                                    vehicle.vehicleno
                                )}
                            </strong>
                        </td>
                        <td>

                            <span class="cleaning">

                                ${safe(
                                    vehicle.routecleaned_p
                                )}%

                            </span>

                        </td>
                         <td>
                            ${safe(
                                vehicle.vehicletype
                            )}
                        </td>
                        <td>
                            ${safe(
                                vehicle.vstatus
                            )}
                        </td>
                        <td>
                            ${safe(
                                vehicle.drivername
                            )}
                        </td>

                        <td>
                            ${safe(
                                vehicle.timerecorded
                            )}
                        </td>

                        

                        <td>
                            ${safe(
                                vehicle.vehiclestatus
                            )}
                        </td>

                        

                        <td>
                            ${safe(
                                vehicle.speed
                            )}
                        </td>

                        <td>
                            ${safe(
                                vehicle.gsm
                            )}
                        </td>

                        <td>
                            ${safe(
                                vehicle.gps
                            )}
                        </td>

                        <td>
                            ${safe(
                                vehicle.vehiclebattery
                            )}
                        </td>

                        <td>
                            ${safe(
                                vehicle.gpsbattery
                            )}
                        </td>

                        

                        <td>
                            ${safe(
                                vehicle.drivermobile
                            )}
                        </td>

                       

                        

                        <td>
                            ${safe(
                                vehicle.ignition
                            )}
                        </td>

                        <td>
                            ${safe(
                                vehicle.routename
                            )}
                        </td>

                        <td>
                            ${safe(
                                vehicle.totalpoints
                            )}
                        </td>

                        <td>
                            ${safe(
                                vehicle.totalcleanedpoints
                            )}
                        </td>

                        <td>
                            ${safe(
                                vehicle.totalnotcleanedpoints
                            )}
                        </td>

                        

                        

                    </tr>

                `;

            }
        );

    }


    html += `

                </tbody>

            </table>

        </div>

    `;


    output.innerHTML =
        html;

}


/* =====================================================
   CSV EXPORT — ALL VEHICLE DATA
   ===================================================== */

function exportCleaningCSV() {

    const vehicles =
        getLowCleaningVehicles();


    if (
        vehicles.length === 0
    ) {

        alert(
            "No vehicles found with Cleaning % below 90%."
        );

        return;

    }


    const headers = [

        "S.No.",
        "Ward Name",
    
        "Vehicle No.",
        "Cleaning %",
        "Vehicle Type",
        "VStatus",
        "Driver Name",
        "Time Recorded",
       
      
        
        "Speed",
        "GSM",
        "GPS",
        "Vehicle Battery",
        "GPS Battery",
        
        "Driver Mobile",
        
       
        "Ignition",
        "Route Name",
        "Total Points",
        "Total Cleaned Points",
        "Total Not Cleaned Points",
        
      
        
 

    ];


    const rows =
        vehicles.map(
            (vehicle, index) => [

                index + 1,
                vehicle.wardname,                

                vehicle.vehicleno,
                vehicle.routecleaned_p,
                vehicle.vehicletype,
                vehicle.vstatus,
                vehicle.drivername,

                vehicle.timerecorded,
                

                vehicle.speed,

                vehicle.gsm,

                vehicle.gps,

                vehicle.vehiclebattery,

                vehicle.gpsbattery,

                

                vehicle.drivermobile,

                

                vehicle.ignition,

                vehicle.routename,

                vehicle.totalpoints,

                vehicle.totalcleanedpoints,

                vehicle.totalnotcleanedpoints,

                

               

                

             

            ]
        );


    function escapeCSV(value) {

        const text =
            String(
                value ?? ""
            );


        if (
            text.includes(",") ||
            text.includes('"') ||
            text.includes("\n") ||
            text.includes("\r")
        ) {

            return (
                '"' +
                text.replace(
                    /"/g,
                    '""'
                ) +
                '"'
            );

        }


        return text;

    }


    const csv = [

        headers,

        ...rows

    ]

    .map(
        row =>
            row
                .map(escapeCSV)
                .join(",")
    )

    .join("\r\n");


    const blob =
        new Blob(

            [
                "\uFEFF" + csv
            ],

            {
                type:
                    "text/csv;charset=utf-8;"
            }

        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href = url;


    link.download =
        "Vehicles_Cleaning_Below_90_Percent.csv";


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );


    URL.revokeObjectURL(
        url
    );

}


/* =====================================================
   SAFE HTML
   ===================================================== */

function safe(value) {

    return String(
        value ?? "-"
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* RUN */

displayResults();

</script>


</body>

</html>
